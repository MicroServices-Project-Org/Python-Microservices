server:
  port: 8006

spring:
  application:
    name: search-service

  elasticsearch:
    uris: http://localhost:9200

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: search-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Span per consumed record, continuing the producer's trace from the W3C
      # traceparent header (product-service's aiokafka instrumentation adds it)
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0   # dev: keep every trace (matches the Python services)
  otlp:
    tracing:
      # Spring's exporter speaks OTLP over HTTP (4318), not gRPC (4317) like the Python services
      endpoint: http://localhost:4318/v1/traces
  metrics:
    tags:
      service: search-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s

# Product Service (source of truth for reconciliation)
product:
  service:
    url: http://localhost:8001

# Reconciliation job (DiffReconcileJob): Mongo → ES one-way sync, safety net for Kafka outages and ES drift
reconciliation:
  enabled: true
  interval:
    ms:  1800000 # DEFAULT 30 minutes (USE THIS VALUE FOR TESTING 30000)
  initial:
    delay:
      ms: 60000  # DEFAULT 60 seconds after startup (USE THIS VALUE FOR TESTING 10000)