name: Docker Validation

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "docker-compose.yml"
      - "docker/**"
      - "**/Dockerfile"
      - "**/.dockerignore"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "docker-compose.yml"
      - "docker/**"
      - "**/Dockerfile"
      - "**/.dockerignore"
  workflow_dispatch:  # ← allows manual trigger from GitHub UI

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Validate docker-compose.yml
  # ─────────────────────────────────────────────
  validate-compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        run: docker compose config --quiet

      - name: Check all services are defined
        run: |
          REQUIRED_SERVICES=(
            "mongodb"
            "postgres"
            "zookeeper"
            "kafka"
            "kafka-ui"
            "keycloak"
            "prometheus"
            "grafana"
            "loki"
            "tempo"
            "promtail"
            "redis"
            "elasticsearch"
            # app services (profile "apps")
            "api-gateway"
            "product-service"
            "order-service"
            "inventory-service"
            "notification-service"
            "ai-service"
            "search-service"
          )
          for svc in "${REQUIRED_SERVICES[@]}"; do
            if docker compose --profile apps config --services | grep -q "^${svc}$"; then
              echo "✅ $svc found"
            else
              echo "❌ $svc is MISSING from docker-compose.yml"
              exit 1
            fi
          done

      - name: Check all required volumes are defined
        run: |
          REQUIRED_VOLUMES=(
            "mongo_data"
            "postgres_data"
            "prometheus_data"
            "grafana_data"
            "loki_data"
            "tempo_data"
            "keycloak_data"
            "zookeeper_data"
            "zookeeper_log"
            "kafka_data"
            "redis_data"
            "es_data"
          )
          for vol in "${REQUIRED_VOLUMES[@]}"; do
            if docker compose config | grep -q "${vol}:"; then
              echo "✅ Volume $vol found"
            else
              echo "❌ Volume $vol is MISSING"
              exit 1
            fi
          done

  # ─────────────────────────────────────────────
  # JOB 1b — Build the app images from a clean checkout
  # (catches Dockerfiles that depend on local build output)
  # ─────────────────────────────────────────────
  build-images:
    name: Build app images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build all app service images
        run: docker compose --profile apps build

  # ─────────────────────────────────────────────
  # JOB 2 — Lint Dockerfiles (hadolint)
  # Runs only when Dockerfiles exist in the repo
  # Automatically picks up new service Dockerfiles
  # ─────────────────────────────────────────────
  lint-dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find all Dockerfiles
        id: find
        run: |
          FILES=$(find . -name "Dockerfile" | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          if [ -z "$FILES" ]; then
            echo "no_dockerfiles=true" >> $GITHUB_OUTPUT
            echo "ℹ️ No Dockerfiles found yet — skipping lint"
          else
            echo "no_dockerfiles=false" >> $GITHUB_OUTPUT
            echo "Found Dockerfiles: $FILES"
          fi

      - name: Lint Dockerfiles with hadolint
        if: steps.find.outputs.no_dockerfiles == 'false'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          failure-threshold: warning
          ignore: DL3008  # ignore "pin versions in apt-get" for dev images

  # ─────────────────────────────────────────────
  # JOB 3 — Validate config files exist
  # Ensures all required docker/ config files
  # are present and not empty
  # ─────────────────────────────────────────────
  validate-configs:
    name: Validate Config Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required config files exist
        run: |
          REQUIRED_FILES=(
            "docker/postgres/init-multiple-dbs.sh"
            "docker/prometheus/prometheus.yml"
            "docker/loki/loki-config.yaml"
            "docker/tempo/tempo-config.yaml"
            "docker/promtail/promtail-config.yaml"
            "docker/grafana/provisioning/datasources/datasources.yaml"
          )
          for f in "${REQUIRED_FILES[@]}"; do
            if [ -f "$f" ]; then
              echo "✅ $f exists"
            else
              echo "❌ $f is MISSING"
              exit 1
            fi
          done

      - name: Check config files are not empty
        run: |
          REQUIRED_FILES=(
            "docker/prometheus/prometheus.yml"
            "docker/loki/loki-config.yaml"
            "docker/tempo/tempo-config.yaml"
            "docker/promtail/promtail-config.yaml"
            "docker/grafana/provisioning/datasources/datasources.yaml"
          )
          for f in "${REQUIRED_FILES[@]}"; do
            if [ -s "$f" ]; then
              echo "✅ $f is not empty"
            else
              echo "❌ $f is EMPTY"
              exit 1
            fi
          done

      - name: Check init script is executable
        run: |
          if [ -x "docker/postgres/init-multiple-dbs.sh" ]; then
            echo "✅ init-multiple-dbs.sh is executable"
          else
            echo "❌ init-multiple-dbs.sh is NOT executable — run: chmod +x docker/postgres/init-multiple-dbs.sh"
            exit 1
          fi

  # ─────────────────────────────────────────────
  # JOB 4 — Summary
  # Posts a summary to the PR / commit
  # ─────────────────────────────────────────────
  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-compose, build-images, lint-dockerfiles, validate-configs]
    if: always()

    steps:
      - name: Post summary
        run: |
          echo "## 🐳 Docker Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Validate docker-compose.yml | ${{ needs.validate-compose.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build app images | ${{ needs.build-images.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint Dockerfiles | ${{ needs.lint-dockerfiles.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate Config Files | ${{ needs.validate-configs.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY