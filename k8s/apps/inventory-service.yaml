apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector: {app: inventory-service}
  ports:
    - port: 8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels: {app: inventory-service}
  template:
    metadata:
      labels: {app: inventory-service}
    spec:
      enableServiceLinks: false   # injected *_PORT=tcp://... vars would break Settings (e.g. REDIS_PORT)
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: inventory-service
          image: ecommerce/inventory-service:dev
          imagePullPolicy: Never   # loaded into kind by deploy.sh
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: app-secrets, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: app-secrets, key: POSTGRES_PASSWORD}}
          readinessProbe:
            httpGet: {path: /health, port: 8003}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8003}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
