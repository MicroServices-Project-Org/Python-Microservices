apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector: {app: product-service}
  ports:
    - port: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1
  selector:
    matchLabels: {app: product-service}
  template:
    metadata:
      labels: {app: product-service}
    spec:
      enableServiceLinks: false   # injected *_PORT=tcp://... vars would break Settings (e.g. REDIS_PORT)
      initContainers:
        - name: wait-for-mongodb
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongodb 27017; do echo waiting for mongodb; sleep 2; done"]
      containers:
        - name: product-service
          image: ecommerce/product-service:dev
          imagePullPolicy: Never   # loaded into kind by deploy.sh
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - name: MONGO_USERNAME
              valueFrom: {secretKeyRef: {name: app-secrets, key: MONGO_USERNAME}}
            - name: MONGO_PASSWORD
              valueFrom: {secretKeyRef: {name: app-secrets, key: MONGO_PASSWORD}}
          readinessProbe:
            httpGet: {path: /health, port: 8001}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
