apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector: {app: ai-service}
  ports:
    - port: 8005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  replicas: 1
  selector:
    matchLabels: {app: ai-service}
  template:
    metadata:
      labels: {app: ai-service}
    spec:
      enableServiceLinks: false   # injected *_PORT=tcp://... vars would break Settings (e.g. REDIS_PORT)
      containers:
        - name: ai-service
          image: ecommerce/ai-service:dev
          imagePullPolicy: Never   # loaded into kind by deploy.sh
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - name: GROQ_API_KEY
              valueFrom: {secretKeyRef: {name: app-secrets, key: GROQ_API_KEY, optional: true}}
            - name: GEMINI_API_KEY
              valueFrom: {secretKeyRef: {name: app-secrets, key: GEMINI_API_KEY, optional: true}}
          readinessProbe:
            httpGet: {path: /health, port: 8005}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8005}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
