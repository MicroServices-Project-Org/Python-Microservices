# SMTP credentials are only used with EMAIL_ENABLED=true.
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector: {app: notification-service}
  ports:
    - port: 8004
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels: {app: notification-service}
  template:
    metadata:
      labels: {app: notification-service}
    spec:
      enableServiceLinks: false   # injected *_PORT=tcp://... vars would break Settings (e.g. REDIS_PORT)
      containers:
        - name: notification-service
          image: ecommerce/notification-service:dev
          imagePullPolicy: Never   # loaded into kind by deploy.sh
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef: {name: app-config}
          env:
            - name: SMTP_USERNAME
              valueFrom: {secretKeyRef: {name: app-secrets, key: SMTP_USERNAME, optional: true}}
            - name: SMTP_PASSWORD
              valueFrom: {secretKeyRef: {name: app-secrets, key: SMTP_PASSWORD, optional: true}}
          readinessProbe:
            httpGet: {path: /health, port: 8004}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8004}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
